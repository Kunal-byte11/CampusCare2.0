<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5f8a" />
      <stop offset="100%" stop-color="#2a9d8f" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#74c69d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" flood-color="#0f2b3e" />
    </filter>
  </defs>
  
  <!-- Rounded Shield / Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
  
  <!-- Heart and Care Motif -->
  <g filter="url(#shadow)" transform="translate(0, 1)">
    <!-- Heart outline -->
    <path d="M32 46.5 C32 46.5 17 37 17 26.5 C17 21.2 21.2 17 26.5 17 C29.4 17 32 18.5 32 21 C32 18.5 34.6 17 37.5 17 C42.8 17 47 21.2 47 26.5 C47 37 32 46.5 32 46.5 Z" 
          fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Sprouting Wellness Leaf -->
    <path d="M32 23 C34 29 42 27 41 33 C40 37 36 38 32 39 C32 33 30 27 32 23 Z" 
          fill="url(#leafGrad)" />
  </g>
</svg>